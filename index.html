<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キーワード回答</title>

<style>

body{
    font-family:"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
    background:#f5f1e8;
    color:#3d342d;
    text-align:center;
    margin:0;
    padding:60px 20px;
}
    
/* メインカード */
.box{
    max-width:620px;
    margin:auto;
    background:#fffdf9;
    padding:45px;
    border:2px solid #b89b5e;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

/* タイトル */
h1{
    color:#6d5843;
    font-size:30px;
    margin:10px 0;
    letter-spacing:2px;
    font-weight:normal;
}

/* 金色の装飾線 */
.line{
    width:90%;
    margin:0 auto;
    border-top:1px solid #b89b5e;
    position:relative;
}

.line::after{
    content:"✦";
    position:absolute;
    left:50%;
    top:-12px;
    transform:translateX(-50%);
    background:#fffdf9;
    color:#b89b5e;
    padding:0 12px;
    font-size:14px;
}

/* 説明文 */
p{
    line-height:1.9;
    font-size:16px;
}

/* 入力欄 */
input{
    width:300px;
    padding:12px;
    margin-top:25px;
    font-size:18px;
    text-align:center;
    border:1px solid #b89b5e;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#8b6d3c;
    box-shadow:0 0 8px rgba(184,155,94,.3);
}

/* ボタン */
button{
    margin-top:28px;
    padding:13px 42px;
    font-size:16px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(#8b7355,#6d5843);
    border:1px solid #b89b5e;
    border-radius:30px;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    background:linear-gradient(#9b8262,#78614c);
}

button:active{
    transform:translateY(1px);
}

/* ヒント */
.hint{
    margin-top:35px;
    color:#6d5843;
    font-size:14px;
    letter-spacing:2px;
    line-height:1.8;
}

/* 正解表示 */
#result{
    margin-top:35px;
    line-height:2;
    font-size:16px;
}

/* フェードイン */
.fade{
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.treasure{
    width:130px;
    margin:40px auto 0;
    display:block;
    image-rendering:pixelated;
    transition:opacity .4s ease;
}
    
.reward{
    display:inline-block;
    width:270px;
    max-width:100%;
    height:auto;
    margin-top:20px;
    border:2px solid #b89b5e;
    border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    image-rendering:pixelated;
}

.download{
    display:inline-block;
    margin-top:20px;
    padding:12px 28px;
    background:#6d5843;
    color:white;
    text-decoration:none;
    border-radius:25px;
    transition:.2s;
}

.download:hover{
    background:#8b7355;
}
/* ---------- スマホ用 ---------- */
@media (max-width:600px){

    body{
        padding:30px 15px;
    }

    .box{
        padding:25px 18px;
    }

    h1{
        font-size:24px;
    }

    p{
        font-size:15px;
    }

    input{
        width:90%;
        max-width:300px;
        font-size:17px;
    }

    button{
        width:90%;
        max-width:300px;
        font-size:17px;
    }

    #result{
        font-size:15px;
    }

}
</style>

</head>

<body>

<div class="box">

<div class="line"></div>

<h1>🗝　キーワード回答　🗝</h1>

<div class="line" style="margin-bottom:30px;"></div>

<p>
主様、キーワードはすべてお集まりでしょうか。<br><br>
見つけたキーワードを入力してください。
</p>

<input
type="text"
id="answer"
placeholder="キーワード">

<br>

<button onclick="check()">
🗝 回答する
</button>

<div class="hint">
ヒント：● ★ △ ○ ▼ □ ？ ■
</div>

<div id="result"></div>
<img
    id="treasure"
    class="treasure"
    src="treasure.png"
    alt="宝箱">
</div>

    <script>
function normalizeAnswer(text) {
    return text
        .trim()
        .replace(/\s/g, "")
        .normalize("NFKC");
}        
function check(){

    // 入力文字（空白削除）
   const ans = normalizeAnswer(
    document.getElementById("answer").value
);

    const correctAnswers = [
        "アトランティスⅡ号",
        "アトランティスII号",
        "アトランティス2号",
        "アトランティス２号"
    ];

    const result = document.getElementById("result");
　　const treasure = document.getElementById("treasure");
    // 正解！
    if(correctAnswers.includes(ans)){

        // 解錠中表示
        result.innerHTML =
        '<div class="fade">' +
        '<p style="color:#6d5843;font-size:18px;">🗝 解錠中...</p>' +
        '</div>';

        // 1秒後に記念品表示
        setTimeout(function(){
        treasure.style.opacity = "0";

        setTimeout(function(){

        treasure.style.display = "none";

        },400);

            result.innerHTML =

            '<div class="fade">' +

            '<p style="font-size:24px;color:#6d5843;margin-bottom:10px;"><strong>お見事です、主様。</strong></p>' +

            '<p>' +
            '謎を解き明かした主様へ、<br>' +
            'ささやかな記念品をご用意いたしました。<br>' +
            'ピクスクの会場で使用できるぬい風ゼパルさんのアバターでございます。<br>' +
            'どうぞお受け取りください。' +
            '</p>' +

            '<img class="reward" src="Zepar.png" alt="記念品">' +

            '<br>' +

            '<a class="download" href="Zepar.png" download>' +
            '記念品をダウンロード' +
            '</a>' +

            '</div>';

        },800);

    }else{

        result.innerHTML =
        '<div class="fade">' +
        '<p style="color:#8b3d3d;">' +
        'キーワードが違うようです。<br>' +
        'もう一度、確認してみましょう。' +
        '</p>' +
        '</div>';

    }

}

</script>

<!-- クリック・タップで金色の星が放射状に広がる演出 -->
<style>
  .keyword-sparkle {
    position: fixed;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 99999;
  }

  .keyword-sparkle-star {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--star-size);
    height: var(--star-size);
    background: var(--star-color);
    clip-path: polygon(
      50% 0%,
      62% 35%,
      100% 50%,
      62% 65%,
      50% 100%,
      38% 65%,
      0% 50%,
      38% 35%
    );
    transform: translate(-50%, -50%);
    animation: keyword-star-burst 1s ease-out forwards;
  }

  @keyframes keyword-star-burst {
    0% {
      transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      opacity: 0;
    }
    15% {
      opacity: 1;
    }
    100% {
      transform:
        translate(
          calc(-50% + var(--move-x)),
          calc(-50% + var(--move-y))
        )
        scale(0.15)
        rotate(var(--star-rotate));
      opacity: 0;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .keyword-sparkle-star {
      animation-duration: 0.15s;
    }
  }
</style>

<script>
(() => {
  const STAR_COUNT = 11;
  const COLORS = [
    "#C69A45",
    "#E6C778",
    "#F5DE9B",
    "#B58B4C",
    "#FFF0C8"
  ];

  document.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;

    const sparkle = document.createElement("div");
    sparkle.className = "keyword-sparkle";
    sparkle.style.left = event.clientX + "px";
    sparkle.style.top = event.clientY + "px";

    document.body.appendChild(sparkle);

    for (let i = 0; i < STAR_COUNT; i++) {
      const star = document.createElement("span");
      star.className = "keyword-sparkle-star";

      const angle =
        (Math.PI * 2 * i / STAR_COUNT) +
        (Math.random() - 0.5) * 0.3;

      const distance = 45 + Math.random() * 55;
      const size = 23 + Math.random() * 12;

      star.style.setProperty("--star-size", size + "px");
      star.style.setProperty(
        "--star-color",
        COLORS[Math.floor(Math.random() * COLORS.length)]
      );
      star.style.setProperty(
        "--move-x",
        Math.cos(angle) * distance + "px"
      );
      star.style.setProperty(
        "--move-y",
        Math.sin(angle) * distance + "px"
      );
      star.style.setProperty(
        "--star-rotate",
        (Math.random() * 180 - 90) + "deg"
      );

      sparkle.appendChild(star);
    }

    setTimeout(() => sparkle.remove(), 1100);
  }, { passive: true });
})();
</script>

</body>
</html>
